<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spot The Error</title>

<style>

/* Default = PC/Desktop */
.spot-cat{

  width:10%;

  position:absolute;

  top:5%;
  left:50%;

  transform:translateX(-50%);

  z-index:5;

  pointer-events:none;

  filter:
  drop-shadow(0 12px 24px rgba(0,0,0,0.2));

  animation:
  catFloat 3s ease-in-out infinite;

  transition:
  opacity 0.35s ease,
  transform 0.35s ease;

}

/* Mobile */
@media (max-width: 768px){

  .spot-cat{
    width:25%;
  }

}

@keyframes catFloat{

  0%{
    transform:
    translateX(-50%)
    translateY(0px);
  }

  50%{
    transform:
    translateX(-50%)
    translateY(-8px);
  }

  100%{
    transform:
    translateX(-50%)
    translateY(0px);
  }

}

.gameover-cat{

  width:160px;

  margin-bottom:10px;

  filter:
  drop-shadow(0 12px 24px rgba(0,0,0,0.2));

}

:root{
  --primary:#0e257a;
  --secondary:#F3BE7A;
  --accent:#FFC81E;
  --bg:#5E7AC4;
  --card:#ffffff;
  --text:#12233c;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Inter,sans-serif;
  background:radial-gradient(circle at top left,#12233c 0%,#175385 40%,#00163a 100%);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.game-container{
  width:100%;
  max-width:700px;
  background:white;
  border-radius:28px;
  padding:2rem;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,0.15);
  position:relative;
  overflow:hidden;
}

.back-btn{
  position:absolute;
  top:20px;
  left:20px;
  width:42px;
  height:42px;
  border-radius:50%;
  background:white;
  color:var(--primary);
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.4rem;
  font-weight:700;
  box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

h1{
  color:var(--primary);
  margin-bottom:1rem;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:1.5rem;
  flex-wrap:wrap;
  gap:1rem;
}

.score,
.level,
.timer{
  font-weight:700;
}

.hearts{
  display:flex;
  gap:0.4rem;
  font-size:1.5rem;
}

.heart.lost{
  opacity:0.25;
  transform:scale(0.8);
}

.sentence{
  font-size:1.7rem;
  font-weight:700;
  line-height:1.8;
  margin:2rem 0;
}

.word{
  display:inline-block;
  margin:0.2rem;
  padding:0.3rem 0.6rem;
  border-radius:12px;
  cursor:pointer;
  transition:0.2s;
}

.word:hover{
  background:#ffe7b8;
}

.selected{
  background:var(--secondary);
}

.options{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
  margin-top:24px;
  width:100%;
}

.option-btn{
  padding:1.1rem;
  border:none;
  border-radius:14px;
  background:var(--primary);
  color:white;
  font-weight:700;
  cursor:pointer;
  transition:0.2s;
  min-height:64px;
font-size:1rem;
line-height:1.4;
}

.option-btn:hover{
  transform:translateY(-2px);
}

input{
  width:100%;
  padding:1rem;
  border-radius:14px;
  border:2px solid #ddd;
  font-size:1rem;
  margin-top:1rem;
  outline:none;
}

input:focus{
  border-color:var(--primary);
}

.submit-btn{
  margin-top:1rem;
  padding:1rem 1.5rem;
  border:none;
  border-radius:14px;
  background:var(--primary);
  color:white;
  font-weight:700;
  cursor:pointer;
}

.feedback{
  margin-top:1rem;
  font-weight:700;
  min-height:30px;
}

.correct{
  color:green;
}

.wrong{
  color:#d62828;
}

.correct-flash{
  animation:correctFlash 0.45s;
}

.wrong-shake{
  animation:shake 0.45s;
}

@keyframes correctFlash{
  0%{
    background:#b7ffb7;
  }

  100%{
    background:white;
  }
}

@keyframes shake{
  0%,100%{
    transform:translateX(0);
  }

  20%{
    transform:translateX(-10px);
  }

  40%{
    transform:translateX(10px);
  }

  60%{
    transform:translateX(-8px);
  }

  80%{
    transform:translateX(8px);
  }
}

#countdown-screen{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
  cursor:pointer;
}

#countdown-number{
  font-size:7rem;
  color:white;
  font-weight:900;
}

.count-animate{
  animation:pop 0.9s ease;
}

@keyframes pop{
  0%{
    transform:scale(0.7);
    opacity:0;
  }

  60%{
    transform:scale(1.08);
    opacity:1;
  }

  100%{
    transform:scale(1);
    opacity:1;
  }
}

#confetti{
  position:fixed;
  inset:0;
  pointer-events:none;
}

.game-over{
  display:none;
}

.game-over h2{
  color:#d62828;
  margin-bottom:1rem;
}

.explanation{
  margin-top:1rem;
  color:#555;
  line-height:1.6;
}

.share-btn{
  margin-top:1rem;
  background:#1d9bf0;
}

.motivation{
  margin-top:1rem;
  color:var(--primary);
  font-weight:700;
}

.timer-warning{
  color:red;
  transform:scale(1.1);
}

@media(max-width:600px){

body{
  padding:10px;
  align-items:center;
}
  .game-container{
    padding:1rem;
    border-radius:18px;
    margin-top:10px;
  }

  h1{
    font-size:1.5rem;
    margin-top:10px;
  }

  .top-bar{
    gap:0.6rem;
    justify-content:center;
    font-size:0.9rem;
  }

  .score,
  .level,
  .timer{
    font-size:0.95rem;
  }

  .hearts{
    font-size:1.2rem;
  }

  .sentence{
    font-size:1.15rem;
    line-height:1.7;
    margin:1.4rem 0;
  }

  .word{
    padding:0.22rem 0.45rem;
    margin:0.12rem;
  }

  #instruction-text{
    font-size:0.9rem;
    margin-top:0 !important;
  }

  .option-btn{
    min-height:54px;
    padding:0.9rem;
    font-size:0.92rem;
    border-radius:12px;
  }

  .submit-btn{
    width:100%;
    padding:0.95rem;
    font-size:0.95rem;
  }

  input{
    padding:0.9rem;
    font-size:0.95rem;
  }

  .feedback,
  .motivation{
    font-size:0.92rem;
  }

  .game-over h2{
    font-size:1.5rem;
  }

  #final-score{
    font-size:2.2rem;
  }

  /* FIX HUGE TAP TO START */

  #countdown-number{
    font-size:2.4rem;
    text-align:center;
    line-height:1.2;
    padding:0 20px;
    max-width:90%;
    word-break:break-word;
  }

  .back-btn{
    width:38px;
    height:38px;
    font-size:1.1rem;
    top:14px;
    left:14px;
  }

}

</style>
</head>

<script>



let usedQuestions = [];
const clickSound =
document.getElementById("click-sound");

const loseSound =
document.getElementById("lose-sound");

clickSound.volume = 0.08;
loseSound.volume = 0.15;

const spotCat =document.getElementById("spotCat");

const questions = [



/* EASY */

{
sentence:"She do not like apples.",
wrong:["do"],
answers:["does"],
explanation:"'She' uses 'does', not 'do'.",
options:["do","does","did","done"],
difficulty:1
},

{
sentence:"He are playing football.",
wrong:["are"],
answers:["is"],
explanation:"'He' uses 'is'.",
options:["are","is","am","be"],
difficulty:1
},

{
sentence:"They was happy yesterday.",
wrong:["was"],
answers:["were"],
explanation:"'They' uses 'were'.",
options:["was","were","is","be"],
difficulty:1
},

{
sentence:"I goed to school yesterday.",
wrong:["goed"],
answers:["went"],
explanation:"Past tense of go is went.",
options:["goed","went","goes","gone"],
difficulty:1
},

{
sentence:"She don't likes coffee.",
wrong:["don't"],
answers:["doesn't"],
explanation:"'She' uses 'doesn't'.",
options:["don't","doesn't","didn't","not"],
difficulty:1
},

{
sentence:"He have a new bicycle.",
wrong:["have"],
answers:["has"],
explanation:"'He' uses 'has'.",
options:["have","has","had","having"],
difficulty:1
},

{
sentence:"We was late to class.",
wrong:["was"],
answers:["were"],
explanation:"'We' uses 'were'.",
options:["was","were","is","am"],
difficulty:1
},

{
sentence:"She eat breakfast every morning.",
wrong:["eat"],
answers:["eats"],
explanation:"'She' uses 'eats'.",
options:["eat","eats","eating","ate"],
difficulty:1
},

{
sentence:"He go to school daily.",
wrong:["go"],
answers:["goes"],
explanation:"He/she/it uses 'goes'.",
options:["go","goes","went","going"],
difficulty:1
},
{
sentence:"She eat rice every day.",
wrong:["eat"],
answers:["eats"],
explanation:"Third person singular uses 'eats'.",
options:["eat","eats","ate","eating"],
difficulty:1
},
{
sentence:"They plays football.",
wrong:["plays"],
answers:["play"],
explanation:"Plural subject uses base verb.",
options:["play","plays","playing","played"],
difficulty:1
},
{
sentence:"I goes to market.",
wrong:["goes"],
answers:["go"],
explanation:"I uses 'go'.",
options:["go","goes","went","gone"],
difficulty:1
},
{
sentence:"She have a pen.",
wrong:["have"],
answers:["has"],
explanation:"She uses 'has'.",
options:["have","has","had","having"],
difficulty:1
},

/* MEDIUM */

{
sentence:"She was cooking when I was call her.",
wrong:["call"],
answers:["called"],
explanation:"Past continuous + past simple mismatch.",
options:["call","called","calling","calls"],
difficulty:2
},
{
sentence:"They has finished their work yesterday.",
wrong:["has"],
answers:["have"],
explanation:"Plural subject uses 'have'.",
options:["has","have","had","having"],
difficulty:2
},
{
sentence:"I didn't went there.",
wrong:["went"],
answers:["go"],
explanation:"After did/didn't use base verb.",
options:["go","went","gone","going"],
difficulty:2
},

{
sentence:"He go to school and eat lunch yesterday.",
wrong:["go","eat"],
answers:["went","ate"],
explanation:"Past tense needed.",
options:["went","ate","goes","eated"],
difficulty:2
},

{
sentence:"They has completed the assignment.",
wrong:["has"],
answers:["have"],
explanation:"'They' uses 'have'.",
options:["has","have","had","having"],
difficulty:2
},

{
sentence:"She was watching TV when the lights go out.",
wrong:["go"],
answers:["went"],
explanation:"Past tense needed.",
options:["go","went","gone","going"],
difficulty:2
},

{
sentence:"I have seen him yesterday.",
wrong:["have"],
answers:["saw"],
explanation:"Use simple past with yesterday.",
options:["have","saw","seen","seeing"],
difficulty:2
},

{
sentence:"There is many students in the hall.",
wrong:["is"],
answers:["are"],
explanation:"Plural noun uses 'are'.",
options:["is","are","was","be"],
difficulty:2
},

{
sentence:"She can sings beautifully.",
wrong:["sings"],
answers:["sing"],
explanation:"After 'can', use base verb.",
options:["sings","sing","sang","sung"],
difficulty:2
},


/* HARD */

{
sentence:"She is one of the best player in the team.",
wrong:["player"],
answers:["players"],
explanation:"'One of the' requires plural noun.",
options:["player","players","playing","played"],
difficulty:3
},
{
sentence:"He suggested me to go home.",
wrong:["to"],
answers:["going"],
explanation:"Correct: suggested + verb-ing.",
options:["to","for","going","go"],
difficulty:3
},

{
sentence:"Neither of the boys were prepared for the competition.",
wrong:["were"],
answers:["was"],
explanation:"'Neither' is singular.",
options:["were","was","are","be"],
difficulty:3
},

{
sentence:"One of the players have injured his leg.",
wrong:["have"],
answers:["has"],
explanation:"'One' is singular.",
options:["have","has","had","having"],
difficulty:3
},

{
sentence:"She is one of the smartest student in the class.",
wrong:["student"],
answers:["students"],
explanation:"Use plural noun here.",
options:["student","students","student's","students'"],
difficulty:3
},

{
sentence:"The teacher gave an useful example.",
wrong:["an"],
answers:["a"],
explanation:"'Useful' starts with consonant sound.",
options:["a","an","the","no article"],
difficulty:3
},

{
sentence:"He insisted to paying the bill himself.",
wrong:["to"],
answers:["on"],
explanation:"Correct phrase is 'insisted on'.",
options:["to","on","for","with"],
difficulty:3
},

{
sentence:"Had I knew about the meeting, I would have attended.",
wrong:["knew"],
answers:["known"],
explanation:"Use past participle with 'had'.",
options:["knew","known","know","knowing"],
difficulty:3
},

{
sentence:"No sooner did he arrive when it started raining.",
wrong:["when"],
answers:["than"],
explanation:"Correct phrase is 'No sooner... than'.",
options:["when","than","then","that"],
difficulty:3
},

/* VERY HARD MULTI ERROR */

{
sentence:"She don't went to the market yesterday.",
wrong:["don't","went"],
answers:["didn't","go"],
explanation:"Use 'didn't go'.",
options:["didn't","go","went","goes"],
difficulty:4
},

{
sentence:"The childrens was playing in the park.",
wrong:["childrens","was"],
answers:["children","were"],
explanation:"Correct plural is 'children' and use 'were'.",
options:["children","were","was","childs"],
difficulty:4
},

{
sentence:"Had I knew this earlier, I would help you.",
wrong:["knew","help"],
answers:["known","have helped"],
explanation:"Mixed conditional requires correct structure.",
options:["knew","known","help","have helped"],
difficulty:4
},

{
sentence:"He have wrote a letter to his friend.",
wrong:["have","wrote"],
answers:["has","written"],
explanation:"Correct form is 'has written'.",
options:["has","written","wrote","have"],
difficulty:4
},

{
sentence:"She can dances very good.",
wrong:["dances","good"],
answers:["dance","well"],
explanation:"Use base verb and adverb.",
options:["dance","well","good","dances"],
difficulty:4
}


];

let score = 0;
let level = 1;
let hearts = 3;
let streak = 0;
let currentQuestion;
let selectedWord = null;
let correctedWords = [];

let timer = 20;
let timerInterval;

const gameContainer =
document.getElementById("game-container");

const sentenceElement =
document.getElementById("sentence");

const feedback =
document.getElementById("feedback");

const typingArea =
document.getElementById("typing-area");

const correctionInput =
document.getElementById("correction-input");

const multipleChoiceArea =
document.getElementById("multiple-choice-area");

const scoreElement =
document.getElementById("score");

const levelElement =
document.getElementById("level");

const timeElement =
document.getElementById("time");

const heartsElement =
document.getElementById("hearts");

const motivation =
document.getElementById("motivation");

const timerBox =
document.getElementById("timer-box");

const correctSound =
document.getElementById("correct-sound");

const wrongSound =
document.getElementById("wrong-sound");

const streakSound =
document.getElementById("streak-sound");

const timeoutSound =
document.getElementById("timeout-sound");

correctSound.volume = 0.12;
wrongSound.volume = 0.10;
streakSound.volume = 0.10;
timeoutSound.volume = 0.08;

function unlockAudio(){

  const sounds = [
    clickSound,
    correctSound,
    wrongSound,
    streakSound,
    timeoutSound,
    loseSound
  ];

  sounds.forEach(sound => {

    sound.volume = sound.volume;

    const playPromise = sound.play();

    if(playPromise !== undefined){

      playPromise.then(() => {

        sound.pause();
        sound.currentTime = 0;

      }).catch(() => {});

    }

  });

}

function updateCatMood(){

  if(hearts === 2){

    spotCat.src =
    "assets/cat/shocked-cat.png";
  }

  else if(hearts === 1){

    spotCat.src =
    "assets/cat/sad-cat.png";
  }

  else{

    spotCat.src =
    "assets/cat/mouth-slightly-open-cat.png";
  }

}

function getQuestion(){

  clearInterval(timerInterval);

  feedback.textContent = "";
  motivation.textContent = "";
  selectedWord = null;
  correctedWords = [];
  timerBox.classList.remove("timer-warning");

  let availableQuestions = [];

  // LEVEL BASED DIFFICULTY

  if(level <= 3){

    availableQuestions =
    questions.filter(q => q.difficulty === 1);

  }

  else if(level <= 6){

    availableQuestions =
    questions.filter(q =>
      q.difficulty <= 2
    );

  }

  else if(level <= 10){

    availableQuestions =
    questions.filter(q =>
      q.difficulty <= 3
    );

  }

  else{

    availableQuestions = questions;

  }

  // REMOVE RECENTLY USED QUESTIONS

  let remainingQuestions =
  availableQuestions.filter(q =>
    !usedQuestions.includes(q.sentence)
  );

  // RESET IF ALL USED

  if(remainingQuestions.length === 0){

    usedQuestions = [];

    remainingQuestions = availableQuestions;
  }

  // RANDOM QUESTION

  currentQuestion =
  remainingQuestions[
    Math.floor(
      Math.random() *
      remainingQuestions.length
    )
  ];

  // SAVE USED QUESTION

  usedQuestions.push(
    currentQuestion.sentence
  );

  // KEEP ONLY LAST 10

  if(usedQuestions.length > 10){

    usedQuestions.shift();
  }

  renderSentence();

  if(level <= 3){

    renderMultipleChoice();

  } else {

    multipleChoiceArea.innerHTML = "";
  }

  // HARDER TIMER WITH LEVELS

  if(level <= 3){

    timeElement.textContent = "--";

  }

  else{

    if(level <= 5){

      timer = 20;

    }

    else if(level <= 10){

      timer = 15;

    }

    else{

      timer = 10;
    }

    startTimer();
  }

}

function renderSentence(){

  sentenceElement.innerHTML = "";

  const words =
  currentQuestion.sentence.split(" ");

  words.forEach(word => {

    const span =
    document.createElement("span");

    span.classList.add("word");

    span.textContent = word;

    // EVERY WORD CLICKABLE
    span.onclick = () => selectWord(word,span);

    sentenceElement.appendChild(span);

  });

}

function renderMultipleChoice(){

  multipleChoiceArea.innerHTML = "";

}

function selectWord(word,element){

  document.querySelectorAll(".word")
  .forEach(w => w.classList.remove("selected"));

  element.classList.add("selected");
clickSound.pause();

clickSound.currentTime = 0;

clickSound.play().catch(() => {});
  selectedWord =
  word.replace(/[.,!?]/g,"");

  // LEVELS 1-3
  // SHOW OPTIONS ONLY AFTER SELECTING WORD
  if(level <= 3){

    multipleChoiceArea.innerHTML = "";

    currentQuestion.options.forEach(option => {

      const btn =
      document.createElement("button");

      btn.classList.add("option-btn");

      btn.textContent = option;

      btn.onclick = () => {

        correctionInput.value = option;

        submitCorrection();
      };

      multipleChoiceArea.appendChild(btn);

    });

    typingArea.style.display = "none";
  }

  // LEVEL 4+
  else{

    multipleChoiceArea.innerHTML = "";

    typingArea.style.display = "block";

    correctionInput.focus();
  }

}

function submitCorrection(){

  if(!selectedWord){

    feedback.textContent =
    "Select a word first.";

    feedback.className =
    "feedback wrong";

    return;
  }

  const input =
  correctionInput.value
  .trim()
  .toLowerCase();

  const cleanSelected =
  selectedWord.replace(/[.,!?]/g,"");

  const index =
  currentQuestion.wrong.indexOf(cleanSelected);

  // USER CLICKED WRONG WORD
  if(index === -1){

    feedback.textContent =
    "That's not the incorrect word.";

    feedback.className =
    "feedback wrong";

    handleWrong();

    return;
  }

  // USER CORRECTED PROPERLY
  if(input === currentQuestion.answers[index]){

    feedback.textContent =
    "Correct!";

    feedback.className =
    "feedback correct";

    correctedWords.push(cleanSelected);

    // MULTI ERROR LEVELS
    if(level >= 6){

      // MARK WORD AS FIXED
      document.querySelectorAll(".word")
      .forEach(wordEl => {

        if(
          wordEl.textContent.replace(/[.,!?]/g,"")
          === cleanSelected
        ){

          wordEl.style.background =
          "#b7ffb7";

          wordEl.style.pointerEvents =
          "none";
        }

      });

      correctionInput.value = "";
      selectedWord = null;

      // CHECK IF ALL FIXED
      if(
        correctedWords.length
        === currentQuestion.wrong.length
      ){

        handleCorrect();
      }

    } else {

      handleCorrect();
    }

  }

  // WRONG CORRECTION
  else {

    feedback.textContent =
    "Wrong correction.";

    feedback.className =
    "feedback wrong";

    handleWrong();
  }

}

function handleCorrect(){

  clearInterval(timerInterval);

correctSound.pause();

correctSound.currentTime = 0;

catHappySound.play()
.catch(() => {});

  gameContainer.classList.add("correct-flash");

  setTimeout(() => {
    gameContainer.classList.remove("correct-flash");
  },450);

  streak++;

  if(streak >= 3){

  streakSound.pause();

streakSound.currentTime = 0;

streakSound.play()
.catch(() => {});

    launchConfetti();
  }

  let points = 1;

  if(streak >= 3){
    points = 2;
  }

  if(streak >= 5){
    points = 3;
  }

  score += points;

  level++;

  scoreElement.textContent = score;
  levelElement.textContent = level;

  typingArea.style.display = "none";
  correctionInput.value = "";

  const messages = [
    "Sharp eyes!",
    "Grammar genius!",
    "Too easy for you!",
    "Perfect catch!"
  ];

  motivation.textContent =
  messages[Math.floor(Math.random()*messages.length)];

  setTimeout(() => {

    getQuestion();

  },700);

}

function handleWrong(){

  if(hearts > 0){
  feedback.textContent = `Wrong! ${hearts} hearts left`;
}

  clearInterval(timerInterval);

  streak = 0;

  hearts--;

  updateHearts();

  gameContainer.classList.add("wrong-shake");

  setTimeout(() => {

    gameContainer.classList.remove("wrong-shake");

  },450);

  // LAST HEART LOST
  if(hearts <= 0){
catSadSound.currentTime = 0;
catSadSound.play();


    loseSound.play().catch(() => {});

    endGame();

  }

  // NORMAL WRONG ANSWER
  else{

    wrongSound.pause();
    wrongSound.currentTime = 0;

    wrongSound.play().catch(() => {});

    setTimeout(() => {

      getQuestion();

    },700);

    

  }

}

function updateHearts(){

  const heartSpans =
  document.querySelectorAll(".heart");

  heartSpans.forEach((heart,index) => {

    if(index >= hearts){

      heart.classList.add("lost");
    }

  });

  updateCatMood();

}

function startTimer(){

  timeElement.textContent = timer;

  timerInterval = setInterval(() => {

    timer--;

    timeElement.textContent = timer;

    if(timer <= 5){

      timerBox.classList.add("timer-warning");

      if(timer > 0){

        timeoutSound.pause();

        timeoutSound.currentTime = 0;

        timeoutSound.play().catch(() => {});
      }

    }

    if(timer <= 0){

      clearInterval(timerInterval);

      timeoutSound.pause();

      timeoutSound.currentTime = 0;

      timeoutSound.play().catch(() => {});

      handleWrong();
    }

  },1000);

}

function endGame(){

updateScore("spot", score);

  clearInterval(timerInterval);

  loseSound.pause();

  loseSound.currentTime = 0;

  loseSound.play().catch(() => {});

  spotCat.style.transition = "none";
  spotCat.style.opacity = "0";

  document.getElementById("game-area").style.display = "none";

  document.getElementById("game-over").style.display = "block";

  document.getElementById("final-score").textContent = score;

document.getElementById("explanation").innerHTML = currentQuestion
? `❌ ${currentQuestion.explanation}`
: `❌ No explanation available`;

 let data = getData();
let user = data.currentUser;

let best = data.users[user]?.stats?.spot?.best || 0;

document.getElementById("explanation").innerHTML =
`
❌ ${currentQuestion?.explanation || "No explanation"}
<br><br>
🏆 Best Score: ${best}
`;

}

function restartGame(){

  score = 0;
  level = 1;
  hearts = 3;
  streak = 0;

spotCat.style.opacity = "1";

updateCatMood();

  scoreElement.textContent = score;
  levelElement.textContent = level;

  document.getElementById("game-area").style.display = "block";

  document.getElementById("game-over").style.display = "none";

  document.querySelectorAll(".heart")
  .forEach(h => h.classList.remove("lost"));

  getQuestion();

  

}

function shareScore(){

  const text =
  `🔍 I scored ${score} points in Spot The Error! Play the game here https://eng-boo.vercel.app`;

  if(navigator.share){

    navigator.share({
      title:"Spot The Error",
      text:text
    });

  } else {

    alert(text);
  }

}

function launchConfetti(){

  const canvas =
  document.getElementById("confetti");

  const ctx =
  canvas.getContext("2d");

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const pieces = [];

  for(let i=0;i<120;i++){

    pieces.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height - canvas.height,
      r:Math.random()*6 + 2,
      d:Math.random()*120
    });

  }

  let angle = 0;

  function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    for(let i=0;i<pieces.length;i++){

      const p = pieces[i];

      ctx.beginPath();

      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);

ctx.fillStyle = "#ffffff";

      ctx.fill();

    }

    update();

  }

  function update(){

    angle += 0.01;

    for(let i=0;i<pieces.length;i++){

      const p = pieces[i];

      p.y += Math.cos(angle + p.d) + 3;

      p.x += Math.sin(angle);

      if(p.y > canvas.height){

        p.y = -10;
      }

    }

  }

  let confettiAnimation =
  setInterval(draw,20);

  setTimeout(() => {

    clearInterval(confettiAnimation);

    ctx.clearRect(0,0,canvas.width,canvas.height);

  },2500);

}

function startCountdown(){

  let count = 3;

  const countdownNumber =
  document.getElementById("countdown-number");

  const countdownScreen =
  document.getElementById("countdown-screen");

  function animate(text){

    countdownNumber.classList.remove("count-animate");

    void countdownNumber.offsetWidth;

    countdownNumber.textContent = text;

    countdownNumber.classList.add("count-animate");

  }

  animate(count);

  const interval = setInterval(() => {

    count--;

    if(count > 0){

      animate(count);

    }

    else if(count === 0){

      animate("GO!");

    }

    else{

      clearInterval(interval);

      setTimeout(() => {

        countdownScreen.style.display = "none";

        getQuestion();

      },700);

    }

  },1000);

}

document.getElementById("countdown-screen")
.addEventListener("click",() => {

  unlockAudio();

  startCountdown();

},{
  once:true
});

if(correctionInput){

  correctionInput.addEventListener("keydown",(e)=>{

    if(e.key === "Enter"){

      submitCorrection();
    }

  });

}

updateCatMood();

const catHappySound =
document.getElementById("cat-happy-sound");

const catSadSound =
document.getElementById("cat-sad-sound");

const catScreamSound =
document.getElementById("cat-scream-sound");

catHappySound.volume = 0.18;
catSadSound.volume = 0.18;
catScreamSound.volume = 0.22;

</script>
