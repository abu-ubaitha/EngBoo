<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EngBoo Login</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: linear-gradient(135deg,#0f172a,#1e1b4b,#0b1020);
  overflow:hidden;
  color:white;
}

/* glow */
.bg-blobs::before,
.bg-blobs::after{
  content:"";
  position:absolute;
  width:300px;
  height:300px;
  background:rgba(255,120,0,0.25);
  border-radius:50%;
  filter:blur(80px);
  animation: float 8s infinite ease-in-out;
  z-index:-1;
}

.bg-blobs::after{
  right:10%;
  bottom:10%;
  background:rgba(0,150,255,0.25);
  animation-delay:2s;
}

@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-40px);}
}

/* card */
.box{
  width:340px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  border-radius:20px;
  padding:25px;
  box-shadow:0 20px 60px rgba(0,0,0,0.4);
  text-align:center;
}

/* inputs */
.input-box{
  position:relative;
  margin:12px 0;
}

input{
  width:90%;
  padding:12px;
  border-radius:10px;
  border:none;
  outline:none;
}

/* buttons */
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  margin-top:10px;
  font-weight:bold;
  cursor:pointer;
}

.secondary{
  background:#1e40af;
  color:white;
}

/* tabs */
.tabs{
  display:flex;
  margin-bottom:10px;
}

.tabs button{
  flex:1;
  background:transparent;
  border:1px solid rgba(255,255,255,0.2);
  color:white;
  padding:10px;
  cursor:pointer;
}

.tabs button.active{
  background:#ff7a00;
}

/* shake */
.shake{
  animation: shake 0.4s;
}

@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-8px);}
  40%{transform:translateX(8px);}
  60%{transform:translateX(-6px);}
  80%{transform:translateX(6px);}
}

/* icons */
.eye,.info{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
}

/* modal */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:white;
  color:black;
  padding:20px;
  border-radius:12px;
  width:280px;
}

.close{
  margin-top:10px;
  background:red;
  color:white;
}
</style>
</head>

<body>

<div class="bg-blobs"></div>

<div class="box" id="card">

  <h2>EngBoo</h2>
  <p>Learn English, Arcade Style 🎮</p>

  <div class="tabs">
    <button id="loginTab" class="active" onclick="switchTab(true)">Login</button>
    <button id="signupTab" onclick="switchTab(false)">Signup</button>
  </div>

  <div class="input-box">
    <input id="username" placeholder="Username">
    <span class="info" onclick="openInfo()">ℹ️</span>
  </div>

  <div class="input-box">
    <input id="password" type="password" placeholder="Password">
    <span class="eye" onclick="togglePass()">👁</span>
  </div>

  <button class="secondary" onclick="handleAction()" id="actionBtn">
    Login
  </button>

</div>

<!-- modal -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3>Why accounts?</h3>
    <p>We store game progress, scores, and stats for your profile page.</p>
    <button class="close" onclick="closeInfo()">Close</button>
  </div>
</div>

<script src="storage.js"></script>

<script>

let isLogin = true;

const card = document.getElementById("card");
const username = document.getElementById("username");
const password = document.getElementById("password");
const actionBtn = document.getElementById("actionBtn");

function switchTab(loginMode){
  isLogin = loginMode;

  document.getElementById("loginTab").classList.toggle("active", isLogin);
  document.getElementById("signupTab").classList.toggle("active", !isLogin);

  actionBtn.textContent = isLogin ? "Login" : "Create Account";
}

function togglePass(){
  password.type = password.type === "password" ? "text" : "password";
}

function openInfo(){
  document.getElementById("modal").style.display = "flex";
}

function closeInfo(){
  document.getElementById("modal").style.display = "none";
}

function shake(){
  card.classList.add("shake");
  setTimeout(()=>card.classList.remove("shake"),400);
}

function handleAction(){

  let u = username.value.trim();
  let p = password.value.trim();

  if(u.length < 3 || p.length < 3){
    shake();
    return;
  }

  if(isLogin){

    if(loginUser(u,p)){
      window.location.href = "index.html";
    } else {
      shake();
    }

  } else {

    if(registerUser(u,p)){
      loginUser(u,p);
      window.location.href = "index.html";
    } else {
      shake();
    }

  }
}

</script>

</body>
</html>
