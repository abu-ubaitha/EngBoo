<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hangman Game</title>

<style>

.cat-mascot{

  position:absolute;

  top:10px;

  left:35%;

  transform:translateX(-50%);

  z-index:10;

  pointer-events:none;

  filter:
  drop-shadow(0 12px 24px rgba(0,0,0,0.2));

  animation:
  floatCat 3s ease-in-out infinite;

}

.cat-mascot img{

  width:140px;

  display:block;

}

:root{
  --primary:#0e257a;
  --secondary:#F3BE7A;
  --accent:#FFC81E;
  --bg:#5E7AC4;
  --card:#ffffff;
  --text:#12233c;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Inter,sans-serif;
  background:
  radial-gradient(
    circle at top left,
    #12233c 0%,
    #800040 40%,
    #c300ff 100%
  );

  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.game-container{
  width:100%;
  max-width:700px;
  background:white;
  border-radius:28px;
  padding:2rem;
  box-shadow:0 20px 50px rgba(0,0,0,0.15);
  text-align:center;
  position:relative;
  overflow:visible;
  margin-top:120px;
}

.back-btn{
  position:absolute;
  top:20px;
  left:20px;
  width:42px;
  height:42px;
  border-radius:50%;
  background:white;
  color:var(--primary);
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.4rem;
  font-weight:700;
  box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

h1{
  color:var(--primary);
  margin-bottom:1rem;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:1rem;
  flex-wrap:wrap;
  margin-bottom:1.5rem;
}

.stat{
  font-weight:700;
}

.hearts{
  display:flex;
  gap:0.4rem;
  font-size:1.4rem;
}

.heart.lost{
  opacity:0.3;
  transform:scale(0.8);
}

.hint{
  margin-top:1rem;
  color:#666;
  font-weight:600;
}

.word-display{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:12px;
  margin:2rem 0;
}

.letter-box{
  width:48px;
  height:58px;
  border-radius:14px;
  background:#f4f4f4;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:1.8rem;
  font-weight:800;
  color:var(--primary);
}

.keyboard{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:12px;
  margin-top:2rem;
}

.key{
  padding:1rem;
  border:none;
  border-radius:14px;
  background:var(--primary);
  color:white;
  font-weight:700;
  cursor:pointer;
  transition:0.2s;
  font-size:1rem;
}

.key:hover{
  transform:translateY(-2px);
}

.key.correct{
  background:#2a9d50;
}

.key.wrong{
  background:#d62828;
}

.key:disabled{
  opacity:0.6;
  cursor:not-allowed;
}

.reveal-btn{
  margin-top:1.5rem;
  padding:1rem 1.4rem;
  border:none;
  border-radius:14px;
  background:var(--secondary);
  color:var(--primary);
  font-weight:800;
  cursor:pointer;
  font-size:1rem;
}

.streak{
  margin-top:1rem;
  color:#ff7b00;
  font-weight:800;
}

.definition-box{
  margin-top:1.5rem;
  line-height:1.7;
  color:#444;
}

.correct-flash{
  animation:correctFlash 0.45s;
}

.wrong-shake{
  animation:shake 0.45s;
}

@keyframes correctFlash{

  0%{
    background:#b7ffb7;
  }

  100%{
    background:white;
  }

}

@keyframes shake{

  0%,100%{
    transform:translateX(0);
  }

  20%{
    transform:translateX(-10px);
  }

  40%{
    transform:translateX(10px);
  }

  60%{
    transform:translateX(-8px);
  }

  80%{
    transform:translateX(8px);
  }

}

#countdown-screen{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
  cursor:pointer;
}

#countdown-number{
  font-size:7rem;
  font-weight:900;
  color:white;
}

.count-animate{
  animation:pop 0.9s ease;
}

@keyframes pop{

  0%{
    transform:scale(0.7);
    opacity:0;
  }

  60%{
    transform:scale(1.08);
    opacity:1;
  }

  100%{
    transform:scale(1);
    opacity:1;
  }

}

.game-over{
  display:none;
}

#confetti{
  position:fixed;
  inset:0;
  pointer-events:none;
}

@media(max-width:600px){

  body{
    padding:12px;
  }

  .game-container{
    padding:1.2rem;
    border-radius:20px;
  }

  h1{
    font-size:1.6rem;
  }

  .top-bar{

  .stat{

  .keyboard{

    width:100%;
  }

  .key{
    padding:0.8rem 0.2rem;
    font-size:0.9rem;
    min-width:0;
  }

  .letter-box{
    width:40px;
    height:50px;
    font-size:1.4rem;
  }

  .hint{
    font-size:0.95rem;
    line-height:1.5;
  }

    width:100%;
    font-size:0.95rem;
    padding:0.9rem;
  }

    text-align:center;

  }

.cat-message{

  font-weight:700;
  color:#0e257a;
  min-height:24px;
}

@keyframes floatCat{

  0%{
    transform:translateY(0px);
  }

  50%{
    transform:translateY(-8px);
  }

  100%{
    transform:translateY(0px);
  }

}

</style>

  function unlockAudio(){

  [
  correctSound,
  wrongSound,
  timeoutSound,
  loseSound,
  winSound
  ]

    .then(() => {

      sound.pause();
      sound.currentTime = 0;

    })
    .catch(() => {});

  });

  tapSound.pause();
tapSound.currentTime = 0;
tapSound.play().catch(() => {});

function getDifficultyWords(){

  if(level <= 3){

    return words.slice(0,2);

  }

  else if(level <= 6){

    return words.slice(0,3);

  }

  else{

    return words;
  }

}


function startGame(){

  updateCatMood("start");

  gameEnded = false;

  guessedLetters = [];

  definitionBox.innerHTML = "";

  const available =
  getDifficultyWords();

  // REMOVE RECENTLY USED WORDS

  let remainingWords =
  available.filter(item =>
    !usedWords.includes(item.word)
  );

  // RESET IF ALL USED

  if(remainingWords.length === 0){

    usedWords = [];

    remainingWords = available;
  }

  const selected =
  remainingWords[
    Math.floor(
      Math.random() *
      remainingWords.length
    )
  ];

  // SAVE USED WORD

  usedWords.push(selected.word);

  // KEEP ONLY LAST 15 WORDS

  if(usedWords.length > 15){

    usedWords.shift();
  }

  currentWord =
  selected.word;

  hintElement.textContent =
  "💡 Hint: " + selected.hint;

  renderWord();

  renderKeyboard();

  startTimer();

}

function renderWord(){

  wordDisplay.innerHTML = "";

  currentWord.split("")
  .forEach(letter => {

    const box =
    document.createElement("div");

    box.classList.add("letter-box");

    if(guessedLetters.includes(letter)){

      box.textContent = letter.toUpperCase();

    }

    else{

      box.textContent = "_";

    }

    wordDisplay.appendChild(box);

  });

}

function renderKeyboard(){

  keyboard.innerHTML = "";

  const letters =
  "abcdefghijklmnopqrstuvwxyz";

  letters.split("")
  .forEach(letter => {

    const btn =
    document.createElement("button");

    btn.classList.add("key");

    btn.textContent =
    letter.toUpperCase();

    btn.onclick =
    () => guessLetter(letter,btn);

    keyboard.appendChild(btn);

  });

}

function guessLetter(letter,button){

  button.disabled = true;

  // SMALL KEY TAP SOUND
  tapSound.pause();
  tapSound.currentTime = 0;
  tapSound.play().catch(()=>{});

  if(currentWord.includes(letter)){

    updateCatMood("correct");

    button.classList.add("correct");

    guessedLetters.push(letter);

    renderWord();

    /* CHECK IF THIS LETTER FINISHES THE WORD */

    const uniqueLetters =
    [...new Set(currentWord.split(""))];

    const won =
    uniqueLetters.every(l =>
    guessedLetters.includes(l));

    if(won){

      checkWin();

    }

    else{

      catHappySound.currentTime = 0;

      catHappySound.play().catch(()=>{});

    }

  }

function revealLetter(){

function launchConfetti(){

  const canvas =
  document.getElementById("confetti");

  const ctx =
  canvas.getContext("2d");

  canvas.width =
  window.innerWidth;

  canvas.height =
  window.innerHeight;

  const pieces = [];

  for(let i=0;i<120;i++){

    pieces.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height-canvas.height,
      r:Math.random()*6+2,
      d:Math.random()*120
    });

  }

  let angle = 0;

  function draw(){

    ctx.clearRect(
    0,0,canvas.width,canvas.height
    );

    for(let i=0;i<pieces.length;i++){

      const p = pieces[i];

      ctx.beginPath();

      ctx.arc(
      p.x,p.y,p.r,
      0,Math.PI*2
      );

      ctx.fillStyle =
ctx.fillStyle = "#ffffff";

      ctx.fill();

    }

    update();

  }

  function update(){

    angle += 0.01;

    for(let i=0;i<pieces.length;i++){

      const p = pieces[i];

      p.y +=
      Math.cos(angle+p.d)+3;

      p.x +=
      Math.sin(angle);

      if(p.y > canvas.height){

        p.y = -10;
      }

    }

  }

  const animation =
  setInterval(draw,20);

  setTimeout(() => {

    clearInterval(animation);

    ctx.clearRect(
    0,0,canvas.width,canvas.height
    );

  },2500);

}

function startCountdown(){

  let count = 3;

  const countdownNumber =
  document.getElementById("countdown-number");

  const countdownScreen =
  document.getElementById("countdown-screen");

  function animate(text){

    countdownNumber.classList.remove("count-animate");

    void countdownNumber.offsetWidth;

    countdownNumber.textContent = text;

    countdownNumber.classList.add("count-animate");

  }

  animate(count);

  const interval =
  setInterval(() => {

    count--;

    if(count > 0){

      animate(count);

    }

    else if(count === 0){

      animate("GO!");

    }

    else{

      clearInterval(interval);

      setTimeout(() => {

        countdownScreen.style.display =
        "none";

        startGame();

      },700);

    }

  },1000);

}
